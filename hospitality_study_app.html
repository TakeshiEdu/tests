<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ホスピタリティ論学習アプリ（小テスト版）</title>
  <style>
:root {
  --blue: #004da8;
  --blue-2: #0b63ce;
  --ink: #111827;
  --sub: #536176;
  --line: #d9e3f0;
  --soft: #f6f9fd;
  --white: #fff;
  --green: #10966c;
  --orange: #f08a16;
  --shadow: 0 12px 28px rgba(15, 36, 66, .06);
}

* { box-sizing: border-box; }
html { background: var(--white); }
body {
  margin: 0;
  color: var(--ink);
  background: var(--white);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
}
button, input { font: inherit; }
button { cursor: pointer; }
.lucide, [data-lucide] { width: 24px; height: 24px; color: currentColor; stroke: currentColor; flex: 0 0 auto; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(24px, 4vw, 60px);
  background: rgba(255,255,255,.96);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(12px);
}
.brand, .top-actions button {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--ink);
  background: transparent;
  border: 0;
  font-weight: 800;
}
.brand { font-size: 20px; }
.brand small { font-size: 16px; font-weight: 700; }
.brand-mark {
  display: grid;
  place-items: center;
  width: 38px;
  height: 44px;
  color: var(--blue);
}
.brand-mark .lucide { width: 36px; height: 36px; stroke-width: 1.9; }
.top-actions { display: flex; align-items: center; gap: 28px; }
.top-actions button { color: #4b5b70; }
.top-actions .lucide { width: 23px; height: 23px; }
.menu-button { display: none !important; flex-direction: column; gap: 0; font-size: 12px; }

.layout {
  display: grid;
  grid-template-columns: 292px minmax(540px, 1fr) 318px;
  gap: 30px;
  max-width: 1380px;
  margin: 0 auto;
  padding: 34px clamp(24px, 4vw, 60px) 54px;
}
body[data-view="home"] .layout,
body[data-view="bookmarks"] .layout,
body[data-view="mypage"] .layout {
  display: block;
  max-width: 1160px;
}
body[data-view="home"] .sidebar,
body[data-view="home"] .rightbar,
body[data-view="bookmarks"] .sidebar,
body[data-view="bookmarks"] .rightbar,
body[data-view="mypage"] .sidebar,
body[data-view="mypage"] .rightbar { display: none; }
body[data-view="quiz"] .layout { grid-template-columns: 292px minmax(560px, 1fr); }
body[data-view="quiz"] .rightbar { display: none; }
body[data-view="quiz-detail"] .layout { grid-template-columns: 292px minmax(560px, 1fr); }
body[data-view="quiz-detail"] .rightbar { display: none; }
body[data-view="quiz-question"] .layout { grid-template-columns: 292px minmax(560px, 1fr); }
body[data-view="quiz-question"] .rightbar { display: none; }
body[data-view="text"] .layout { grid-template-columns: 292px minmax(560px, 1fr); }
body[data-view="text"] .rightbar { display: none; }
body[data-view="chapter-detail"] .layout { grid-template-columns: 292px minmax(560px, 1fr); }
body[data-view="chapter-detail"] .rightbar { display: none; }

.panel, .progress-card, .home-card, .notice-card, .lesson-card, .bookmark-card, .profile-card, .profile-link {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 8px;
}
.panel { padding: 22px; }
.panel h2, .nav-panel h2 {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 20px;
  color: var(--blue);
  font-size: 21px;
}
.panel h2 .lucide, .nav-panel h2 .lucide { width: 28px; height: 28px; }

.progress-card { padding: 26px 30px; }
.progress-card.bare { padding: 0; border: 0; }
.progress-meta {
  display: grid;
  grid-template-columns: auto auto 1fr;
  align-items: baseline;
  gap: 26px;
  margin-bottom: 14px;
  font-weight: 800;
}
.progress-meta b { font-size: 34px; }
.progress-meta small { justify-self: end; color: var(--ink); font-size: 18px; font-weight: 500; }
.progress-track { height: 12px; overflow: hidden; background: #e8edf4; border-radius: 999px; }
.progress-track span { display: block; height: 100%; background: var(--blue); border-radius: inherit; }

.home-page {
  max-width: 1000px;
  margin: 0 auto;
  display: grid;
  gap: 26px;
}
.home-page h1 { margin: 0; font-size: 30px; }
.continue-button {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  min-height: 72px;
  padding: 0 28px;
  color: #fff;
  background: linear-gradient(135deg, var(--blue), #003f94);
  border: 0;
  border-radius: 7px;
  box-shadow: 0 14px 26px rgba(0,77,168,.18);
  font-size: 22px;
  font-weight: 900;
}
.continue-button .lucide { justify-self: end; }
.home-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px 24px;
}
.home-card {
  display: grid;
  grid-template-columns: 82px 1fr 24px;
  align-items: center;
  min-height: 126px;
  padding: 24px 28px;
  color: var(--blue);
  text-align: left;
}
.home-card > .lucide:first-child { width: 56px; height: 56px; stroke-width: 1.8; }
.home-card b { display: block; color: var(--blue); font-size: 22px; }
.home-card small { display: block; margin-top: 8px; color: var(--ink); font-size: 16px; }
.notice-card {
  display: grid;
  grid-template-columns: 1fr auto 24px;
  align-items: center;
  gap: 24px;
  min-height: 116px;
  padding: 26px 30px;
  text-align: left;
}
.notice-card b { display: block; margin-bottom: 12px; color: var(--blue); font-size: 22px; }
.notice-card small, .notice-card time { color: var(--ink); font-size: 17px; }

.chapter-list { border-top: 1px solid var(--line); margin-top: 22px; padding-top: 16px; }
.chapter-head, .chapter-link, .outline-wide {
  width: 100%;
  min-height: 44px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 12px;
  color: var(--ink);
  background: transparent;
  border: 0;
  border-radius: 6px;
  text-align: left;
  font-weight: 800;
}
.chapter-head {
  flex-wrap: nowrap;
}
.chapter-head span {
  white-space: nowrap;
  flex: 0 0 auto;
}
.chapter-head strong {
  min-width: 0;
  line-height: 1.35;
}
.chapter-head .lucide { margin-left: auto; width: 18px; }
.chapter-link { font-weight: 600; }
.chapter-link span { min-width: 34px; }
.chapter-link strong {
  min-width: 0;
  line-height: 1.35;
}
.chapter-link.active { color: var(--blue); background: #edf4ff; font-weight: 900; }
.outline-wide {
  justify-content: center;
  margin-top: 14px;
  color: var(--blue);
  border: 1px solid var(--line);
  background: #fff;
}

.textbook-index-nav h2 {
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}

.index-progress {
  margin: 20px 0 28px;
}

.index-progress > div:first-child,
.index-progress > div:nth-child(2) {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}

.index-progress span {
  color: var(--sub);
  font-weight: 800;
}

.index-progress small {
  color: var(--sub);
}

.toc-nav {
  display: grid;
  gap: 8px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

.toc-nav h3 {
  margin: 0 0 8px;
  font-size: 17px;
}

.toc-nav button {
  display: grid;
  grid-template-columns: 58px 1fr;
  gap: 12px;
  min-height: 46px;
  padding: 0;
  color: var(--ink);
  background: transparent;
  border: 0;
  text-align: left;
  line-height: 1.5;
  font-weight: 700;
}
.toc-nav button span {
  white-space: nowrap;
}
.toc-nav button strong {
  min-width: 0;
  line-height: 1.35;
}

.chapter-detail-nav .toc-nav {
  gap: 0;
}

.toc-section {
  border-top: 1px solid var(--line);
}

.toc-section:first-of-type {
  border-top: 0;
}

.toc-section > button {
  grid-template-columns: 58px 1fr 18px;
  min-height: 50px;
}

.toc-section > button .lucide {
  width: 18px;
  height: 18px;
  color: var(--blue);
}

.toc-section.open > button {
  color: var(--blue);
  font-weight: 900;
}

.toc-lesson-list {
  display: none;
  padding: 4px 0 12px 14px;
}

.toc-section.open .toc-lesson-list {
  display: grid;
  gap: 4px;
}

.toc-lesson-list button {
  grid-template-columns: 48px 1fr;
  min-height: 38px;
  padding: 0 10px;
  border-radius: 6px;
  font-size: 13px;
}

.toc-lesson-list button.active {
  color: var(--blue);
  background: #edf4ff;
  font-weight: 900;
}

.toc-nav button span {
  color: var(--ink);
  white-space: nowrap;
}

.textbook-index-page h1 {
  margin: 0 0 26px;
  font-size: 28px;
}

.toc-card-list {
  display: grid;
  gap: 18px;
}

.toc-card {
  display: grid;
  grid-template-columns: 58px 1fr 24px;
  align-items: center;
  gap: 20px;
  width: 100%;
  min-height: 106px;
  padding: 22px 26px;
  color: var(--ink);
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
  text-align: left;
}

.toc-card > .lucide:first-child {
  width: 40px;
  height: 40px;
  color: var(--blue);
}

.toc-card > .lucide:last-child {
  color: var(--blue);
}

.toc-card b,
.toc-card strong,
.toc-card small {
  display: block;
}

.toc-card b {
  color: var(--blue);
  margin-bottom: 8px;
}

.toc-card strong {
  font-size: 18px;
  margin-bottom: 8px;
}

.toc-card small {
  color: var(--ink);
}

.chapter-detail-page {
  padding-bottom: 28px;
}

.chapter-detail-head {
  margin-bottom: 24px;
}

.chapter-detail-head h1 {
  margin: 0 0 18px;
  color: var(--ink);
  font-size: 30px;
  line-height: 1.35;
}

.chapter-detail-head p {
  margin: 0;
  max-width: 780px;
  color: var(--sub);
  font-size: 16px;
  line-height: 1.9;
  font-weight: 700;
}

.chapter-lesson-cards {
  display: grid;
  gap: 16px;
}

.chapter-lesson-card {
  display: grid;
  grid-template-columns: 52px 64px minmax(0, 1fr) 24px;
  align-items: center;
  gap: 18px;
  width: 100%;
  min-height: 118px;
  padding: 22px 24px;
  color: var(--ink);
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
  text-align: left;
}

.chapter-lesson-card > .lucide:first-child {
  grid-column: 1;
  grid-row: 1 / 4;
  width: 38px;
  height: 38px;
  color: var(--blue);
}

.chapter-lesson-card > .lucide:last-child {
  grid-column: 4;
  grid-row: 1 / 4;
  align-self: center;
  color: var(--blue);
}

.chapter-lesson-card b,
.chapter-lesson-card strong,
.chapter-lesson-card small,
.chapter-lesson-card em {
  display: block;
}

.chapter-lesson-card b {
  margin-bottom: 5px;
  color: var(--blue);
}

.chapter-lesson-card > span {
  grid-column: 2;
  grid-row: 1;
  color: var(--ink);
  font-weight: 800;
  white-space: nowrap;
}

.chapter-lesson-card strong {
  grid-column: 3;
  grid-row: 1;
  min-width: 0;
  margin-bottom: 0;
  font-size: 19px;
  line-height: 1.45;
}

.chapter-lesson-card small {
  grid-column: 2 / 4;
  grid-row: 2;
  min-width: 0;
  color: var(--sub);
  line-height: 1.65;
}

.chapter-lesson-card em {
  grid-column: 2 / 4;
  grid-row: 3;
  margin-top: 8px;
  color: var(--ink);
  font-style: normal;
  font-weight: 800;
}

.chapter-pager {
  margin-top: 34px;
}

.chapter-detail-footer {
  display: grid;
  grid-template-columns: 140px 1fr 140px;
  align-items: center;
  gap: 18px;
  margin-top: 26px;
}

.chapter-detail-footer span {
  justify-self: center;
  color: var(--ink);
  font-weight: 800;
}

.chapter-detail-footer .outline-button {
  display: inline-flex;
}

.chapter-detail-footer .outline-button:last-child {
  justify-self: end;
}

.quiz-index-sidebar h1 {
  margin: 0 0 24px;
  font-size: 26px;
}

.quiz-index-sidebar .progress-card {
  margin-bottom: 30px;
}

.progress-pages {
  display: flex;
  justify-content: space-between;
  margin-top: 12px;
  color: var(--sub);
}

.quiz-index-sidebar h2 {
  margin: 0 0 14px;
  color: var(--blue);
  font-size: 17px;
}

.quiz-chapter-list {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
}

.quiz-chapter-list button {
  display: grid;
  grid-template-columns: 58px 1fr 22px;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 54px;
  padding: 0 16px;
  color: var(--ink);
  background: #fff;
  border: 0;
  border-top: 1px solid var(--line);
  text-align: left;
}

.quiz-chapter-list button:first-child {
  border-top: 0;
}

.quiz-chapter-list span,
.quiz-chapter-list strong {
  font-size: 14px;
}

.quiz-chapter-list .lucide {
  color: var(--blue);
  width: 18px;
  height: 18px;
}

.quiz-help-card {
  margin-top: 30px;
  padding: 22px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
}

.quiz-help-card h3 {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 14px;
  color: var(--blue);
  font-size: 17px;
}

.quiz-help-card p {
  margin: 0;
  line-height: 1.7;
}

.quiz-detail-list {
  border-radius: 8px;
}

.quiz-section {
  border-top: 1px solid var(--line);
}

.quiz-section:first-child {
  border-top: 0;
}

.quiz-section > button {
  border-top: 0;
}

.quiz-section.open > button {
  color: var(--blue);
  background: #f7fbff;
  font-weight: 900;
}

.quiz-lesson-list {
  display: none;
  padding: 2px 0 10px;
  background: #fff;
}

.quiz-section.open .quiz-lesson-list {
  display: grid;
}

.quiz-lesson-list button {
  grid-template-columns: 44px 1fr auto;
  min-height: 43px;
  padding: 0 16px 0 22px;
  border-top: 1px solid #eef3f9;
}

.quiz-lesson-list button.active {
  color: var(--blue);
  background: #edf4ff;
}

.quiz-lesson-list small {
  color: var(--ink);
  white-space: nowrap;
}

.quiz-index-page {
  min-height: 680px;
  display: grid;
}

.empty-quiz-panel {
  display: grid;
  place-items: center;
  align-content: center;
  min-height: 680px;
  padding: 40px;
  border: 1px solid var(--line);
  border-radius: 8px;
  text-align: center;
}

.empty-quiz-panel > .lucide {
  width: 58px;
  height: 58px;
  padding: 12px;
  color: var(--blue);
  border: 1px solid var(--line);
  border-radius: 50%;
}

.empty-quiz-panel h1 {
  margin: 22px 0 8px;
  font-size: 24px;
}

.empty-quiz-panel p {
  margin: 0 0 78px;
  color: var(--sub);
  font-weight: 700;
}

.empty-quiz-panel button {
  min-width: 350px;
  min-height: 70px;
  color: #a4adbb;
  background: #eef1f6;
  border: 0;
  border-radius: 8px;
  font-size: 18px;
  font-weight: 900;
}

.empty-quiz-panel button small {
  font-size: 14px;
  font-weight: 700;
}

.quiz-detail-page {
  display: grid;
  min-height: 680px;
}

.quiz-detail-head {
  margin-bottom: 18px;
}

.quiz-detail-head h1 {
  margin: 0 0 24px;
  font-size: 30px;
  line-height: 1.35;
}

.quiz-detail-head h2 {
  margin: 0;
  color: var(--blue);
  font-size: 19px;
}

.quiz-question-cards {
  display: grid;
  gap: 16px;
  align-self: start;
}

.quiz-question-card {
  display: grid;
  grid-template-columns: 56px 1fr auto 150px;
  align-items: center;
  gap: 18px;
  width: 100%;
  min-height: 80px;
  padding: 0 24px;
  color: var(--ink);
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
  text-align: left;
}

.quiz-question-card.selected {
  border-color: #8db8f1;
  background: #fbfdff;
  box-shadow: inset 3px 0 0 var(--blue);
}

.quiz-question-number {
  color: var(--ink);
  font-size: 18px;
  font-weight: 900;
}

.quiz-question-card strong {
  font-size: 18px;
}

.quiz-question-card small {
  color: var(--ink);
  white-space: nowrap;
  font-weight: 800;
}

.quiz-card-action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 14px;
  color: var(--blue);
  border: 1px solid #9dbceb;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 900;
}

.quiz-card-action .lucide {
  width: 18px;
  height: 18px;
}

.quiz-detail-footer {
  display: grid;
  grid-template-columns: 190px minmax(240px, 340px);
  justify-content: space-between;
  align-items: end;
  gap: 24px;
  margin-top: 56px;
}

.quiz-detail-footer .outline-button {
  display: inline-flex;
  justify-content: center;
  min-height: 58px;
}

.continue-selected {
  min-height: 58px;
  color: #fff;
  background: var(--blue);
  border: 0;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 900;
}

.continue-selected small {
  font-size: 13px;
  font-weight: 700;
}

.continue-selected:disabled {
  color: #9fa9b8;
  background: #eef1f6;
  cursor: default;
}

.breadcrumbs {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-bottom: 28px;
  color: var(--blue);
  font-size: 13px;
  font-weight: 800;
}
.breadcrumbs button { padding: 0; color: var(--blue); background: transparent; border: 0; font-weight: 800; }
.breadcrumbs strong { color: var(--ink); }
.lesson-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 24px;
}
.lesson-header > div { display: flex; align-items: center; gap: 20px; }
.lesson-number {
  display: grid;
  place-items: center;
  width: 66px;
  height: 66px;
  color: #fff;
  background: var(--blue);
  border-radius: 6px;
  font-size: 24px;
  font-weight: 900;
}
.lesson-header h1 { margin: 0; font-size: 38px; }
.outline-button {
  min-height: 46px;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 0 18px;
  color: var(--blue);
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 6px;
  font-weight: 800;
}
.outline-button.saved { color: #fff; background: var(--blue); }
.lead { margin: 0 0 30px; font-size: 18px; line-height: 1.9; }
.lesson-card {
  display: grid;
  grid-template-columns: 46px 1fr 24px;
  gap: 18px;
  align-items: start;
  min-height: 106px;
  margin-top: 20px;
  padding: 24px 26px;
  border-left: 6px solid var(--blue);
}
.lesson-card > .lucide:first-child { width: 36px; height: 36px; color: var(--blue); }
.lesson-card h2 { margin: 0 0 8px; color: var(--blue); font-size: 21px; }
.lesson-card p, .lesson-card ul { margin: 0; line-height: 1.8; }
.lesson-card.point { border-left-color: var(--green); background: #fbfffd; }
.lesson-card.point h2, .lesson-card.point > .lucide:first-child { color: var(--green); }
.lesson-card.caution { border-left-color: var(--orange); background: #fffdfa; }
.lesson-card.caution h2, .lesson-card.caution > .lucide:first-child { color: var(--orange); }

.pager {
  display: grid;
  grid-template-columns: 150px 1fr 150px;
  align-items: center;
  gap: 18px;
  margin-top: 28px;
}
.pager button {
  min-height: 48px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--blue);
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 6px;
  font-weight: 900;
}

function shuffleQuestionChoices(item) {
  if (item.quiz && Array.isArray(item.quiz.choices) && item.quiz.choices.length > 2) {
    const correctText = item.quiz.choices[item.quiz.answer];
    const shuffled = [...item.quiz.choices];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    item.quiz.choices = shuffled;
    item.quiz.answer = shuffled.indexOf(correctText);
  }
  return item;
}

function progress() {
  const done = Object.keys(state.answers).filter((id) => questions.some((item) => item.id === id)).length;
  return { done, total: questions.length, percent: questions.length ? Math.round((done / questions.length) * 100) : 0 };
}

function correctAnswerCount() {
  return Object.entries(state.answers).filter(([id, answer]) => {
    const question = questions.find((item) => item.id === id);
    return question && question.quiz.answer === answer;
  }).length;
}

function correctRate() {
  const done = progress().done;
  return done ? Math.round((correctAnswerCount() / done) * 100) : 0;
}

function textProgress() {
  const done = state.readLessons.filter((id) => textLessons.some((item) => item.id === id)).length;
  return { done, total: textLessons.length, percent: textLessons.length ? Math.round((done / textLessons.length) * 100) : 0 };
}

function formatStudyTime(seconds = state.studySeconds) {
  const hours = Math.floor(seconds / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  if (hours <= 0) return `${minutes}分`;
  return `${hours}時間 ${minutes}分`;
}

function markLessonRead(id) {
  if (id && !state.readLessons.includes(id)) {
    state.readLessons.unshift(id);
  }
  if (id) {
    state.readLessonHistory[id] = { readAt: Date.now() };
  }
}

function recentRecords(limit = 6) {
  const quizRecords = Object.entries(state.answerHistory).map(([id, record]) => {
    const question = questionById(id);
    const correct = question.quiz.answer === record.selected;
    return {
      id,
      type: "問題演習",
      title: `${question.id} ${question.title}`,
      meta: correct ? "正解" : "復習が必要",
      date: record.answeredAt || 0,
      view: "quiz",
    };
  });
  const textRecords = state.readLessons.map((id, index) => {
    const unit = textLessonById(id);
    return {
      id,
      type: "テキスト",
      title: `${unit.id} ${unit.title}`,
      meta: "読了",
      date: state.readLessonHistory[id]?.readAt || 0,
      view: "text",
    };
  });
  return [...quizRecords, ...textRecords].sort((a, b) => b.date - a.date).slice(0, limit);
}

function splitQuestionText(text) {
  const markers = [...text.matchAll(/([アイウエオ])\s/g)];
  if (!markers.length) return { prompt: text, statements: [] };
  const prompt = text.slice(0, markers[0].index).trim();
  const statements = markers.map((match, index) => {
    const start = match.index + match[0].length;
    const end = markers[index + 1]?.index ?? text.length;
    return {
      label: match[1],
      text: text.slice(start, end).trim(),
    };
  });
  return { prompt, statements };
}

function questionPartsForItem(item) {
  return {
    prompt: item.quiz.q || item.basic || "",
    statements: item.quiz.statements || []
  };
}

function answerOptionsForQuestion(item, statements) {
  if (Array.isArray(item.quiz.options) && item.quiz.options.length) {
    const normalized = normalizeCollapsedPairOptions(item.quiz.options);
    return normalized.map((option, index) => ({
      number: option.number || index + 1,
      text: option.text || "",
      parts: option.parts || [],
    }));
  }
  const statementCount = statements.length;
  const isTruthTable = item.quiz.q.includes("正誤");
  const isPairQuestion = item.quiz.q.includes("正しいものの組み合わせ") || item.quiz.q.includes("正しい組み合わせ");
  if (isTruthTable && statementCount >= 4) {
    const letters = ["ア", "イ", "ウ", "エ"].slice(0, statementCount);
    const patterns = [
      ["正", "正", "正", "正"],
      ["正", "誤", "正", "正"],
      ["正", "誤", "誤", "正"],
      ["誤", "正", "正", "誤"],
      ["誤", "誤", "正", "誤"],
    ];
    return patterns.map((pattern, index) => ({
      number: index + 1,
      parts: letters.map((letter, partIndex) => ({ label: letter, value: pattern[partIndex] || "正" })),
    }));
  }
  if (isPairQuestion && statementCount >= 4) {
    const pairs = [["ア", "イ"], ["ア", "ウ"], ["イ", "ウ"], ["イ", "エ"], ["ウ", "エ"]];
    return pairs.map((pair, index) => ({
      number: index + 1,
      parts: pair.map((letter) => ({ label: letter, value: "" })),
    }));
  }
  return item.quiz.choices.map((choice, index) => ({
    number: index + 1,
    text: choice,
    parts: [],
  }));
}

function normalizeCollapsedPairOptions(options) {
  if (options.length !== 1 || !options[0].text || options[0].parts?.length) {
    return options;
  }
  const text = options[0].text;
  const matches = [...text.matchAll(/(?:^|\s)(\d+)\s*[\.:]?\s*[（(]([アイウエ])\s*[、,]\s*([アイウエ])[）)]/g)];
  if (!matches.length) {
    const fallback = [...text.matchAll(/[（(]([アイウエ])\s*[、,]\s*([アイウエ])[）)]/g)];
    if (fallback.length >= 2) {
      return fallback.map((match, index) => ({
        number: index + 1,
        parts: [
          { label: match[1], value: "" },
          { label: match[2], value: "" },
        ],
      }));
    }
    return options;
  }
  return matches.map((match) => ({
    number: Number(match[1]),
    parts: [
      { label: match[2], value: "" },
      { label: match[3], value: "" },
    ],
  }));
}

function pager(prevLabel, centerLabel, nextLabel) {
  if (state.view === "quiz-question") {
    const current = questionById(state.questionId);
    const list = questionsForChapter(current.chapterId);
    const index = list.findIndex((item) => item.id === current.id);
    const prev = list[Math.max(0, index - 1)];
    const next = list[Math.min(list.length - 1, index + 1)];

    const isLastInChapter = index >= list.length - 1;
    const currentChapterNum = parseInt(current.chapterId);
    const nextChapterNum = currentChapterNum + 1;
    const hasNextChapter = chapterCatalog.some(ch => ch.id === String(nextChapterNum));

    if (isLastInChapter && hasNextChapter) {
      return `<footer class="pager"><button type="button" data-action="prev" ${index <= 0 ? "disabled" : ""}>${icon("chevron-left")} ${prevLabel}</button><span>${centerLabel}</span><button type="button" data-action="open-next-chapter-quiz" data-next-chapter="${nextChapterNum}" class="outline-button">次の章へ進む ${icon("chevron-right")}</button></footer>`;
    }

    return `<footer class="pager"><button type="button" data-action="prev" ${index <= 0 ? "disabled" : ""}>${icon("chevron-left")} ${prevLabel}</button><span>${centerLabel}</span><button type="button" data-action="next" ${index >= list.length - 1 ? "disabled" : ""}>${nextLabel} ${icon("chevron-right")}</button></footer>`;
  }
  const current = textLessonById(state.lessonId);
  const list = textLessonsForChapter(current.chapterId);
  const index = list.findIndex((item) => item.id === current.id);
  return `<footer class="pager"><button type="button" data-action="prev" ${index <= 0 ? "disabled" : ""}>${icon("chevron-left")} ${prevLabel}</button><span>${centerLabel}</span><button type="button" data-action="next" ${index >= list.length - 1 ? "disabled" : ""}>${nextLabel} ${icon("chevron-right")}</button></footer>`;
}

function renderRightbar() {
  if (["home", "bookmarks", "mypage"].includes(state.view)) {
    rightbar.innerHTML = "";
    return;
  }
  const chapter = chapterById(state.chapterId);
  const unit = textLessonById(state.lessonId);
  rightbar.innerHTML = `
    <section class="panel side-quiz">
      <div class="panel-head"><h2>${icon("clipboard-check")}学習メモ</h2><button data-action="open-help">すべて見る</button></div>
      <p>${chapter.title}</p>
      <label>${icon("square-pen")} 現在の教材</label>
      <div class="compact-list"><button type="button" data-text-lesson="${unit.id}"><span>${unit.title}</span><small>第${unit.chapterId}章 ${unit.id}</small></button></div>
      <button class="outline-wide" type="button" data-action="open-help">${icon("circle-help")}使い方を見る</button>
    </section>
  `;
}

function render() {
  saveState();
  document.body.dataset.view = state.view;
  if (state.view === "home") renderHome();
  if (state.view === "text") renderTextIndex();
  if (state.view === "chapter-detail") renderChapterDetail();
  if (state.view === "lesson") renderTextLesson();
  if (state.view === "quiz") renderQuizIndex();
  if (state.view === "quiz-detail") renderQuizDetail();
  if (state.view === "quiz-question") renderQuizQuestion();
  if (state.view === "bookmarks") renderBookmarks();
  if (state.view === "mypage") renderMyPage();
  renderSidebar();
  renderRightbar();
  if (window.lucide) window.lucide.createIcons();
}

function setView(view) {
  state.view = view;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function selectTextLesson(id) {
  const unit = textLessonById(id);
  state.lessonId = unit.id;
  state.chapterId = unit.chapterId;
  state.view = "lesson";
  markLessonRead(unit.id);
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function openChapter(id) {
  state.chapterId = String(id);
  state.lessonId = textLessonsForChapter(id)[0]?.id || state.lessonId;
  state.view = "chapter-detail";
  render();
}

function openQuizChapter(id) {
  state.chapterId = String(id);
  state.quizLessonId = "";
  state.view = "quiz-detail";
  render();
  scrollToQuizDetail();
}

function selectQuizLesson(id) {
  state.quizLessonId = id;
  render();
}

function startQuiz(id) {
  const targetId = id || state.quizLessonId || questionsForChapter(state.chapterId)[0]?.id || state.questionId;
  const item = questionById(targetId);
  state.questionId = item.id;
  state.quizLessonId = item.id;
  state.chapterId = item.chapterId;
  state.view = "quiz-question";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function move(delta) {
  if (state.view === "quiz-question") {
    const current = questionById(state.questionId);
    const list = questionsForChapter(current.chapterId);
    const index = list.findIndex((item) => item.id === current.id);
    const next = list[Math.max(0, Math.min(list.length - 1, index + delta))];
    if (next) startQuiz(next.id);
    return;
  }
  const current = textLessonById(state.lessonId);
  const list = textLessonsForChapter(current.chapterId);
  const index = list.findIndex((item) => item.id === current.id);
  const next = list[Math.max(0, Math.min(list.length - 1, index + delta))];
  if (next) selectTextLesson(next.id);
}

function scrollToQuizDetail() {
  requestAnimationFrame(() => {
    const target = document.querySelector(".quiz-detail-page");
    if (window.matchMedia("(max-width: 760px)").matches && target) {
      target.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
}

function openProfileEditor() {
  openModal("プロフィールを編集", `
    <form class="profile-edit-form">
      <label>名前<input id="profileName" value="${state.profile.name}"></label>
      <label>ID<input id="profileUserId" value="${state.profile.userId}"></label>
      <button type="button" data-action="save-profile">${icon("save")}保存</button>
    </form>
  `);
}

function exportStudyData() {
  const payload = {
    profile: state.profile,
    answers: state.answers,
    answerHistory: state.answerHistory,
    readLessons: state.readLessons,
    readLessonHistory: state.readLessonHistory,
    bookmarks: state.bookmarks,
    studySeconds: state.studySeconds,
    exportedAt: new Date().toISOString(),
  };
  openModal("学習データ", `<pre class="export-box">${JSON.stringify(payload, null, 2)}</pre>`);
}

function clearStudyData() {
  APP_STORAGE_KEYS.forEach((key) => localStorage.removeItem(key));
  window.location.reload();
}

function addStudySeconds() {
  if (document.hidden) return;
  state.studySeconds += 30;
  saveState();
  if (state.view === "mypage" && state.mypageSection === "data") render();
}

document.addEventListener("click", (event) => {
  const button = event.target.closest("button, [role='button']");
  if (!button) return;
  const { view, action } = button.dataset;
  if (view) setView(view);
  if (button.dataset.textLesson) selectTextLesson(button.dataset.textLesson);
  if (action === "next") move(1);
  if (action === "prev") move(-1);
  if (action === "open-next-chapter-quiz") {
    const nextChapter = button.dataset.nextChapter;
    const nextChapterQuestions = questionsForChapter(nextChapter);
    if (nextChapterQuestions.length) {
      startQuiz(nextChapterQuestions[0].id);
      showToast(`第${nextChapter}章へ移動しました`);
    } else {
      openQuizChapter(nextChapter);
    }
  }
  if (action === "toggle-bookmark") {
    const id = state.view === "quiz-question" ? state.questionId : state.lessonId;
    if (isBookmarked(id)) state.bookmarks = state.bookmarks.filter((item) => item !== id);
    else state.bookmarks.unshift(id);
    showToast("ブックマークを更新しました");
    render();
  }
  if (action === "open-card") openLessonModal(button.dataset.modalType || "basic");
  if (action === "open-help") openModal("使い方", "<p>章を選んで教材や問題を開き、わからないところはブックマークして見返してください。</p>");
  if (action === "open-chapter") openChapter(button.dataset.chapterId);
  if (action === "choose-quiz-chapter") openQuizChapter(button.dataset.chapterId);
  if (action === "select-quiz-lesson") selectQuizLesson(button.dataset.quizId);
  if (action === "start-quiz") startQuiz(button.dataset.quizId);
  if (action === "start-selected-quiz") startQuiz();
  if (action === "open-search") openModal("検索", `<form class="search-box"><input placeholder="章名やキーワードで検索"><button type="button">${icon("search")}検索</button></form>`);
  if (action === "mypage-section") {
    state.mypageSection = button.dataset.section || "data";
    render();
  }
  if (action === "edit-profile") openProfileEditor();
  if (action === "save-profile") {
    state.profile.name = $("#profileName")?.value.trim() || state.profile.name;
    state.profile.userId = $("#profileUserId")?.value.trim() || state.profile.userId;
    closeModal();
    showToast("プロフィールを更新しました");
    render();
  }
  if (action === "open-record-lesson") selectTextLesson(button.dataset.lessonId);
  if (action === "export-study-data") exportStudyData();
  if (action === "clear-study-data" && confirm("このブラウザに保存された学習データ（進捗・解答履歴・ブックマークなど）をリセットしますか？")) clearStudyData();
  if (action === "open-support") openModal("学習データについて", "<p>学習時間、解答履歴、読了したテキスト、ブックマークはこのブラウザに保存されます。別の端末やブラウザには自動同期されません。</p>");
  if (action === "logout") setView("home");
  if (action === "close-modal") closeModal();
});

document.addEventListener("change", (event) => {
  if (event.target.name === "answer") {
    const selected = Number(event.target.value);
    const item = questionById(state.questionId);
    state.answers[state.questionId] = selected;
    state.answerHistory[state.questionId] = {
      selected,
      correct: item.quiz.answer === selected,
      answeredAt: Date.now(),
    };
    render();
  }
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") closeModal();
});

$("#mobileMenu")?.addEventListener("click", () => {
  sidebar.classList.toggle("open");
});

modal.addEventListener("click", (event) => {
  if (event.target.dataset.action === "close-modal") closeModal();
});

setInterval(addStudySeconds, 30000);
window.addEventListener("beforeunload", saveState);

render();

  </script>
</body>
</html>
